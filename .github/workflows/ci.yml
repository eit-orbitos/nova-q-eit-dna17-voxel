name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify SHA-256 manifest
        run: python scripts/manifest.py verify
      - name: Unit tests (incl. 4070-mutant fuzz)
        env:
          PYTHONPATH: src
        run: python -B -m unittest discover -s tests -v
      - name: Audit probes
        run: python -I -B probes/probes_equivalent.py
