name: Unpack DNA17 package
on:
  push:
    paths: ['*.zip']
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack ZIP into repository root
        run: |
          set -e
          Z=$(ls *.zip | head -n1)
          mkdir -p /tmp/u && unzip -q "$Z" -d /tmp/u
          SRC=/tmp/u/nova-q-eit-dna17-voxel
          test -f "$SRC/MANIFEST.sha256"
          rm -rf "$SRC/.github"
          git rm -q "$Z"
          cp -a "$SRC"/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack DNA17 V0.1.3 package"
          git push
