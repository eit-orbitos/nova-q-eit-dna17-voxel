[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dna17-voxel"
version = "0.1.3"
description = "NOVA Q / EIT — DNA17 voxel data model and fail-closed validator (software claim only)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Toni Mladenovski" }]

[tool.setuptools.packages.find]
where = ["src"]
